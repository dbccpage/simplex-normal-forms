  <rect x="880" y="68" width="180" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="970" y="84" text-anchor="middle" style="font: 600 11px 'Segoe UI', sans-serif; fill: #e2e8f0;">Extended Form Contract</text>

