<text x="42" y="558" class="body">&#x27;spanning_forest_tight_potentials&#x27;, &#x27;xi_tie_precondition&#x27;]</text>

  <!-- Pillar IV & Non-Claims -->
  <rect x="558" y="500" width="520" height="96" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="558" y="500" width="8" height="96" rx="4" fill="#d97706"/>
  <text x="578" y="522" class="box-title" fill="#92400e">Pillar IV — Syntactic Decidability &amp; Non-Claims</text>
  <text x="578" y="542" class="body">Decidable from declared schema constraints and witness boundaries. |</text>
<text x="578" y="558" class="body">Non-claim: does not permit secondary metric Ξ to break ties when Φ₁</text>
<text x="578" y="574" class="body">or Γ₂ differ between candidates</text>

