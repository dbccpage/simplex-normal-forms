  <text x="394" y="698" class="body">dual flow g₃ satisfies capacity</text>
<text x="394" y="718" class="body">constraints and vertex conservation laws</text>
<text x="394" y="738" class="body">| primal cost matches dual flow</text>
<text x="394" y="758" class="body">objective in exact rational arithmetic |</text>
<text x="394" y="778" class="body">secondary metric tie-break is invoked...</text>

  <line x1="698" y1="734" x2="730" y2="734" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>

