<text x="42" y="452" class="body">unprincipled tie-breaking overriding primary defect worsening</text>

  <!-- Pillar II -->
  <rect x="558" y="394" width="520" height="96" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="558" y="394" width="8" height="96" rx="4" fill="#2563eb"/>
