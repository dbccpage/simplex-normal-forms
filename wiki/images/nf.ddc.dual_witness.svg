  <rect x="22" y="500" width="520" height="96" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="22" y="500" width="8" height="96" rx="4" fill="#16a34a"/>
  <text x="42" y="522" class="box-title" fill="#166534">Pillar III — Lossless Reconstruction</text>
