  <text x="56" y="205" style="font: 600 12px 'Segoe UI', sans-serif; fill: #881337;">Input Carrier (DWNF Candidate)</text>
  <text x="56" y="228" class="mono">Anomaly risk: primal-only defect</text>
<text x="56" y="246" class="mono">claims without dual circulation</text>
<text x="56" y="264" class="mono">certificates, or unprincipled...</text>

