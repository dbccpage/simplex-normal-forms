  <rect x="734" y="654" width="334" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="742" y="668" width="318" height="24" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/><text x="754" y="684" class="pill" fill="#166534">AdmitDualWitness -&gt; Preserve</text><rect x="742" y="700" width="318" height="24" rx="6" fill="#ffe4e6" stroke="#fda4af" stroke-width="1.2"/><text x="754" y="716" class="pill" fill="#991b1b">RejectNonZeroDualityGap -&gt; Invali...</text><rect x="742" y="732" width="318" height="24" rx="6" fill="#ffe4e6" stroke="#fda4af" stroke-width="1.2"/><text x="754" y="748" class="pill" fill="#991b1b">RejectUncertifiedPrimal -&gt; Refuse</text><rect x="742" y="764" width="318" height="24" rx="6" fill="#ffe4e6" stroke="#fda4af" stroke-width="1.2"/><text x="754" y="780" class="pill" fill="#991b1b">RejectInvalidTieBreak -&gt; Reject</text>

  <!-- Footer -->
  <text x="550" y="844" text-anchor="middle" class="footer">Simplex Normal Forms Catalog  •  Contract: nf.ddc.dual_witness  •  certified_implies_authorized: false  •  AuthorityEffect: None</text>
