[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplex-normal-forms"
version = "0.1.0"
description = "Boundary-Certified Data Architecture, Relational Normalization, Cochain Retraction & NF-IR Compiler"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Simplex Normal Forms Authors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.24.0",
    "build>=1.2",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.2",
    "httpx>=0.24.0",
]

[tool.setuptools]
packages = [
    "normal_forms", "normal_forms.bqnf", "normal_forms.domain",
    "normal_forms.rop", "normal_forms.tower", "normal_forms._golden_nfs",
    "normal_forms.resources", "web",
]

# Keep contracts/ as the source owner; install its bytes inside the library.
[tool.setuptools.package-dir]
"normal_forms.resources" = "contracts"

[tool.setuptools.package-data]
"normal_forms.resources" = [
    "*.yaml", "*.sql", "*.json", "*.md",
    "_golden_nfs/*.yaml", "_golden_nfs/*.sql", "bqnf/*.yaml", "data/*.json",
]
"normal_forms.domain" = ["*.yaml"]
web = ["templates/*.html", "static/*.js", "static/*.css"]
