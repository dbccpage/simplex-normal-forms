name: tests-and-distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,web]"
      - run: python -m normal_forms.catalog
      - run: python -m pytest tests web/test_api_smoke.py -q
      - run: node tests/test_frontend.cjs

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install build
      # By default build creates an sdist, then builds the wheel from that sdist.
      - run: python -m build
      - name: Install and exercise wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheel[0]}[web]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m normal_forms.catalog
